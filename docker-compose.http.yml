# Plein R — variante « HTTP simple, sans domaine ».
#
# Sert l'application directement sur le port 80 de l'hôte, joignable par
# http://IP_DU_SERVEUR. Utile pour valider une installation AVANT d'avoir
# fait pointer un nom de domaine sur le serveur : sans domaine, aucune
# autorité ne délivre de certificat, donc pas de HTTPS possible (le port 443
# n'aurait rien à servir).
#
# Utilisation : dans .env, poser
#   COMPOSE_FILE=docker-compose.yml:docker-compose.http.yml
# puis `docker compose up -d --build`.
#
# Une fois le DNS en place, on bascule en HTTPS en remplaçant simplement
# docker-compose.http.yml par docker-compose.caddy.yml dans COMPOSE_FILE
# (voir README). Caddy prend alors les ports 80 et 443.
#
# ATTENTION : en HTTP seul, la CSP de l'application (directive
# `upgrade-insecure-requests`, src/middleware.ts) peut empêcher le navigateur
# de charger les styles et scripts servis par http://IP. Pour une
# vérification fidèle depuis votre poste, passez par un tunnel SSH :
#   ssh -L 8080:localhost:80 utilisateur@IP_DU_SERVEUR
# puis ouvrez http://localhost:8080 (localhost est une origine de confiance,
# la directive ne s'y applique pas).

services:
  app:
    # Remplace la publication 8413 du fichier de base.
    ports: !override
      - "80:3000"

networks:
  # Sans Nginx Proxy Manager, personne ne crée ce réseau : Compose s'en charge.
  proxy:
    external: false
